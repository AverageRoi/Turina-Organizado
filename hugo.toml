baseURL = "https://turinaxlapublica.org/"
enableRobotsTXT = true
title = "Turina xLa Pública"
# A bare `hugo server` here cannot find the theme (it lives at the repo root,
# not in themes/). Serve everything with scripts/serve-all.sh, or run:
#   hugo server --source <this dir> --themesDir <repo parent> --theme hugo-theme-popular

# Events use real future dates; without this Hugo treats a future date as the
# publish date and silently drops upcoming events from the build.
buildFuture = true

# Small page size so the demo shows the theme's list pagination.
[pagination]
  pagerSize = 3

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = "Información"
  url = "/about/"
  weight = 10
[[menu.main]]
  name = "Conócenos"
  parent = "Información"
  url = "/about/"
  weight = 10
[[menu.main]]
  name = "Organizadores"
  parent = "Información"
  url = "/organizers/"
  weight = 20
[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 20
[[menu.main]]
  name = "Calendario"
  url = "/events/"
  weight = 30
[[menu.main]]
  name = "Programa"
  url = "/handbook/"
  weight = 50

[params]
  popularVersion = "0.14.2"
  tagline = "Una organización de activismo estudiantil"
  description = "Una organización de activismo estudiantil."
  brandName = "Turina xLa Pública"
  brandSub = ""
  logo = "images/logo.png"
  ogImage = "images/hero.png"
  landAcknowledgement = "Bienvenido a la web del Turina Organizado"

  [params.brand]
    primary       = "#000000"
    primaryHover  = "#000000"
    primaryActive = "#4f9858"
    secondary     = "#4f9858"
    accent        = "#ffffff"
    surfaceWash   = "#dcddd0"
    surfaceWashSoft = "#000000"

  [params.cta]
    label = "RSVP"
    url   = "/calendar/"
    icon  = "fa-solid fa-calendar"

  [params.notice]
    text = "Ante su censura, **organización de base**."
    url  = "/blog/censura"

  [params.community.chat]
    url   = "/get-involved"
    label = "Organízate"

  [[params.social]]
    label = "Instagram"
    icon  = "fa-brands fa-instagram"
    url   = "https://example.com"
  [[params.social]]
    label = "Mastodon"
    icon  = "fa-brands fa-mastodon"
    url   = "https://example.com"
  [[params.social]]
    label = "RSS"
    icon  = "fa-solid fa-rss"
    url   = "/blog/index.xml"
  [[params.social]]
    label = "Email"
    icon  = "fa-solid fa-envelope"
    url   = "mailto:asamblea@turinaxlapublica.org"

  [params.footer]
    tagline = "Fish · Plants · Community, a Hugo demo site for the Popular theme"
    [params.footer.credit]
      label = "Popular. A Hugo theme by Mariatta."
      url   = "https://popular.mariatta.ca/"
    [[params.footer.columns]]
      title = "Community"
      [[params.footer.columns.links]]
        label = "About us"
        url = "/about/"
      [[params.footer.columns.links]]
        label = "Blog"
        url = "/blog/"
      [[params.footer.columns.links]]
        label = "Code of Conduct"
        url = "/code-of-conduct/"
    [[params.footer.columns]]
      title = "Get involved"
      [[params.footer.columns.links]]
        label = "Contáctanos"
        url = "/get-involved/#contacta-con-nosotros"
      [[params.footer.columns.links]]
        label = "Organízate"
        url = "/get-involved/#organízate-con-la-asamblea"
      [[params.footer.columns.links]]
        label = "Organizers"
        url = "/organizers/"
    [[params.footer.columns]]
      title = "Turina xLa Pública"
      [[params.footer.columns.links]]
        label = "Programa"
        url = "/handbook/"
      [[params.footer.columns.links]]
        label = "Meetup Runbooks"
        url = "/runbooks/"

[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.Calendar]
  mediaType = "text/calendar"
  baseName = "calendar"
  isPlainText = true
  noUgly = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# The Hugo versions this theme supports. themes.gohugo.io's build reads this
# block, not theme.toml's min_version, which is the older field the retired
# hugoThemes repo used; keep the two in step. `extended` is deliberately unset:
# the theme uses no SCSS, so a standard build is enough.
